name: Roq Site Preview

on:
  pull_request:
    branches: [ main ]
  push:
    branches-ignore: [ main ]   # Lets a fork get a preview from a plain branch push, without a PR
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Generate Roq Site
        uses: quarkiverse/quarkus-roq@2.2.0
        with:
          github-pages: 'false'   # Only build, don't configure or upload for GitHub Pages
          site-url: /
      - name: Make preview openable from disk
        # Pages are root-level only, so root-relative URLs can be made relative.
        # This only touches the preview copy, never the real site build.
        run: |
          rm -rf preview && cp -r target/roq preview
          if find preview -mindepth 2 -name '*.html' | grep -q .; then
            echo "::error::Nested HTML pages found; the relative-URL rewrite below only supports root-level pages"
            exit 1
          fi
          find preview -maxdepth 1 -name '*.html' -exec sed -i -E \
            -e 's#(href|src)="/(static|images)/#\1="\2/#g' \
            -e 's#href="/"#href="index.html"#g' {} +
      - name: Upload preview
        uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: preview
          if-no-files-found: error
          retention-days: 14
      - name: Explain how to view the preview
        run: |
          {
            echo "### Site preview"
            echo "Download the \`site-preview\` artifact from this run, unzip it, and open \`index.html\` in a browser."
          } >> "$GITHUB_STEP_SUMMARY"
